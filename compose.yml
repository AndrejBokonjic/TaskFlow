services:

  uporabniki:
    build: ./uporabniki
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/users.db
    volumes:
      - uporabniki_data:/app/data
    restart: unless-stopped

  naloge-grpc:
    build: ./naloge
    command: python -m naloge.grpc.task_server
    ports:
      - "50052:50052"
    volumes:
      - naloge_data:/app/data
    restart: unless-stopped

  naloge:
    build: ./naloge
    command: python -m naloge.main
    ports:
      - "5001:5001"
    environment:
      GRPC_HOST: naloge-grpc   # ← ovo dodaj
    depends_on:
      - naloge-grpc
    volumes:
      - naloge_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projekti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      - "61613:61613"
      - "8161:8161"
    restart: unless-stopped

  projekti:
    build: ./projekti
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/projekti
      ACTIVEMQ_HOST: activemq
      NALOGE_URL: http://naloge:5001
      UPORABNIKI_URL: http://uporabniki:8000
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      naloge:
        condition: service_started
      uporabniki:
        condition: service_started
    restart: unless-stopped

  web-bff:
    build: ./bff/web-bff
    ports:
      - "4000:4000"
    environment:
      USERS_URL: http://uporabniki:8000
      PROJECTS_URL: http://projekti:3000
      TASKS_URL: http://naloge:5001
    depends_on:
      - uporabniki
      - projekti
      - naloge
    restart: unless-stopped

  mobile-bff:
    build: ./bff/mobile-bff
    ports:
      - "4001:4001"
    environment:
      USERS_URL: http://uporabniki:8000
      PROJECTS_URL: http://projekti:3000
      TASKS_URL: http://naloge:5001
    depends_on:
      - uporabniki
      - projekti
      - naloge
    restart: unless-stopped

  ui-shell:
    build: ./ui/shell
    ports:
      - "3001:3001"
    depends_on:
      - mf-auth
      - mf-projekti
      - mf-naloge
    restart: unless-stopped

  mf-auth:
    build: ./ui/mf-auth
    ports:
      - "3002:3002"
    restart: unless-stopped

  mf-projekti:
    build: ./ui/mf-projekti
    ports:
      - "3003:3003"
    restart: unless-stopped

  mf-naloge:
    build: ./ui/mf-naloge
    ports:
      - "3004:3004"
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "80:80"
    depends_on:
      - uporabniki
      - projekti
      - naloge
    restart: unless-stopped

volumes:
  uporabniki_data:
  naloge_data:
  postgres_data: