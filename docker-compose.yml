version: '3.9'

services:

  uporabniki:
    build: ./uporabniki
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./users.db
    volumes:
      - uporabniki_data:/app/data
    restart: unless-stopped

  naloge-grpc:
    build: ./naloge
    command: python -m naloge.grpc.task_server
    ports:
      - "50052:50052"
    volumes:
      - naloge_data:/app/data
    restart: unless-stopped

  naloge:
    build: ./naloge
    command: python -m naloge.main
    ports:
      - "5001:5001"
    depends_on:
      - naloge-grpc
    volumes:
      - naloge_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projekti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      - "61613:61613"
      - "8161:8161"
    restart: unless-stopped

  projekti:
    build: ./projekti
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/projekti
      ACTIVEMQ_HOST: activemq
      NALOGE_URL: http://naloge:5001
      UPORABNIKI_URL: http://uporabniki:8000
    depends_on:
      - postgres
      - activemq
      - naloge
      - uporabniki
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "80:80"
    depends_on:
      - uporabniki
      - projekti
      - naloge
    restart: unless-stopped

volumes:
  uporabniki_data:
  naloge_data:
  postgres_data:
