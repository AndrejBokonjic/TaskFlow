<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; }
    #mf-root { min-height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/single-spa@5.9.4/lib/umd/single-spa.min.js"></script>
</head>
<body>
  <div id="mf-root"></div>

  <script>
    const { registerApplication, start } = singleSpa;
    const BFF_URL = 'http://127.0.0.1:4000';

    let currentUser = JSON.parse(sessionStorage.getItem('tf_user') || 'null');
    const listeners = new Set();

    window.__taskflow__ = {
      BFF_URL,
      getUser: () => currentUser,
      setUser: (user) => {
        currentUser = user;
        if (user) sessionStorage.setItem('tf_user', JSON.stringify(user));
        else sessionStorage.removeItem('tf_user');
        listeners.forEach(fn => fn(user));
      },
      onUserChange: (fn) => {
        listeners.add(fn);
        return () => listeners.delete(fn);
      },
    };

    registerApplication({
      name: 'mf-auth',
      app: () => import('http://127.0.0.1:3002/mf-auth.mjs'),
      activeWhen: () => !window.__taskflow__.getUser(),
    });

    registerApplication({
      name: 'mf-projekti',
      app: () => import('http://127.0.0.1:3003/mf-projekti.mjs'),
      activeWhen: (location) =>
        !!window.__taskflow__.getUser() &&
        !location.pathname.match(/^\/projects\/\d+/),
    });

    registerApplication({
      name: 'mf-naloge',
      app: () => import('http://127.0.0.1:3004/mf-naloge.mjs'),
      activeWhen: (location) =>
        !!window.__taskflow__.getUser() &&
        !!location.pathname.match(/^\/projects\/\d+/),
    });

    start({ urlRerouteOnly: true });
  </script>
</body>
</html>
