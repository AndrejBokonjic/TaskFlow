syntax = "proto3";

package task;

enum TaskStatus {
  TODO = 0;
  IN_PROGRESS = 1;
  DONE = 2;
}

service TaskService {
  rpc CreateTask (CreateTaskRequest) returns (TaskResponse);
  rpc GetTask (GetTaskRequest) returns (TaskResponse);
  rpc ListTasks (Empty) returns (TaskList);
  rpc ListTasksByProject (ListByProjectRequest) returns (TaskList);
  rpc ListTasksByUser (ListByUserRequest) returns (TaskList);
  rpc UpdateTask (UpdateTaskRequest) returns (TaskResponse);
  rpc SetTaskStatus (SetStatusRequest) returns (TaskResponse);
  rpc CompleteTask (CompleteTaskRequest) returns (TaskResponse);
  rpc DeleteTask (DeleteTaskRequest) returns (DeleteTaskResponse);
}

message Task {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 user_id = 4;
  bool completed = 5;
  int32 project_id = 6;
  TaskStatus status = 7;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
  int32 user_id = 3;
  int32 project_id = 4;
}

message GetTaskRequest {
  int32 id = 1;
}

message ListByProjectRequest {
  int32 project_id = 1;
}

message ListByUserRequest {
  int32 user_id = 1;
}

message UpdateTaskRequest {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 user_id = 4;
  int32 project_id = 5;
}

message SetStatusRequest {
  int32 id = 1;
  TaskStatus status = 2;
}

message CompleteTaskRequest {
  int32 id = 1;
}

message DeleteTaskRequest {
  int32 id = 1;
}

message DeleteTaskResponse {
  bool success = 1;
}

message TaskResponse {
  Task task = 1;
}

message TaskList {
  repeated Task tasks = 1;
}

message Empty {}
